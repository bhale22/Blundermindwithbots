<!-- Cylon eye calibration: find the pawn glyph's head sphere in the font the
     device actually used, and pin the scanner to it. -->
<script>
(function(){
  // Font signature of the last successful measurement. The scan below reads
  // back a 320×320 canvas, so skip it when nothing that affects the glyph has
  // changed — the shell observer can otherwise fire it on every class change.
  var lastSig = null;
  function calibrate(){
    var el = document.querySelector('.bab-pawn-eye');
    // Zero height = the Blundermind landing, where .lt-bab is display:none.
    // There is no glyph to measure yet; the shell observer re-runs this the
    // moment the Build-A-Bot title becomes visible.
    if (!el || !el.offsetHeight) return;
    var cs = getComputedStyle(el);
    var sig = cs.fontSize + '|' + cs.fontFamily + '|' + cs.fontStyle + '|' + cs.fontWeight;
    if (sig === lastSig) return;
    var fs = parseFloat(cs.fontSize) || 40;
    var S = 200, PAD = 60, BASE = 250, N = 320;
    var c = document.createElement('canvas'); c.width = c.height = N;
    var g = c.getContext('2d', { willReadFrequently:true });
    if (!g) return;
    g.fillStyle = '#fff'; g.fillRect(0,0,N,N);
    g.fillStyle = '#000';
    g.font = (cs.fontStyle || 'normal') + ' ' + (cs.fontWeight || 400) + ' ' + S + 'px ' + cs.fontFamily;
    g.textBaseline = 'alphabetic';
    g.fillText('♟', PAD, BASE);
    var m = g.measureText('♟');
    var px;
    try { px = g.getImageData(0,0,N,N).data; } catch(e) { return; }
    // Ink extent of each row: the head is the first bulge, the neck the waist
    // right below it, so the head band ends at the first width minimum.
    var rows = [];
    for (var y=0; y<N; y++){
      var x0=-1, x1=-1;
      for (var x=0; x<N; x++){
        if (px[(y*N+x)*4] < 128){ if(x0<0) x0=x; x1=x; }
      }
      if (x1>=0) rows.push({y:y,x0:x0,x1:x1,w:x1-x0+1});
    }
    if (rows.length < 12) return;
    // A pawn's silhouette widens twice: the head, then the collar below the
    // neck — and the collar is the WIDER of the two, so the global maximum is
    // the wrong feature. Walk down from the ink top to the FIRST local maximum
    // (with a tolerance, so pixel wobble isn't read as the pinch) and take the
    // head's geometry from that one row: a circle's widest scanline is its own
    // centre line, which also stays true under the title's italic shear.
    var i, peak = 0, maxW = rows[0].w;
    for (i = 1; i < rows.length; i++){
      if (rows[i].w >= maxW){ maxW = rows[i].w; peak = i; }
      else if (rows[i].w < maxW * 0.94) break;
    }
    var widest = rows[peak].w;
    if (!widest) return;
    // The head's widest scanline is its equator; eye level sits above that —
    // about a third of the head radius up, where eyes sit on a face.
    var hr = widest / 2;
    var yEye = Math.max(rows[0].y + 1, Math.round(rows[peak].y - hr * 0.34));
    // Centre and half-width come from THE EYE ROW, not the equator: the title
    // is italic, so each row further up the head is shifted further right, and
    // the circle is narrower there — a sweep sized for the equator swings off
    // the side of the head.
    var eyeRow = rows[0];
    for (i = 0; i < rows.length; i++){ if (rows[i].y >= yEye){ eyeRow = rows[i]; break; } }
    var cx = (eyeRow.x0 + eyeRow.x1) / 2;
    // Canvas space (200px, baseline at BASE) → element space at its own size.
    var k = fs / S;
    // Baseline read from the DOM instead of font metrics: the pawn is drawn by
    // a fallback symbol font whose ascent/descent differ from the title face's,
    // so a metric-derived baseline lands the eye low on the head.
    var probe = document.createElement('span');
    probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
    el.appendChild(probe);
    var baseline = probe.getBoundingClientRect().top - el.getBoundingClientRect().top;
    el.removeChild(probe);
    if (!(baseline > 0)) {
      var asc  = (m.fontBoundingBoxAscent  || S*0.9)  * k;
      var desc = (m.fontBoundingBoxDescent || S*0.21) * k;
      baseline = (el.offsetHeight - (asc + desc)) / 2 + asc;
    }
    var eyeY = baseline + (eyeRow.y - BASE) * k;
    var eyeX = (cx - PAD) * k;
    var dia  = Math.max(2.2, widest * k * 0.30);
    var travel = Math.max(0.8, (eyeRow.w * k / 2 - dia / 2) * 0.72);
    el.style.setProperty('--eye-y', eyeY.toFixed(2) + 'px');
    el.style.setProperty('--eye-x', eyeX.toFixed(2) + 'px');
    el.style.setProperty('--eye-d', dia.toFixed(2) + 'px');
    // Flat scanner slit rather than a ball
    el.style.setProperty('--eye-h', Math.max(1.3, dia * 0.22).toFixed(2) + 'px');
    el.style.setProperty('--eye-travel', travel.toFixed(2) + 'px');
    lastSig = sig;   // only after a complete measurement, never on a bail-out
  }
  function run(){ try { calibrate(); } catch(e) {} }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
  var t; addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(run, 200); });

  // Switching Blundermind → Build-A-Bot only toggles .landing-expert on the
  // overlay: no load or resize event fires, so without this the eye keeps the
  // CSS em fallbacks and sits off the pawn. Watching the overlay's attributes
  // catches every route in (the shell picker, landingShow re-opening Home, the
  // pre-paint class) without the eye having to know about any of them.
  // The expert title is also a different face from the Blundermind one, so this
  // is a genuine re-measure, not just a repositioning.
  var ov = document.getElementById('landingOverlay');
  if (ov && window.MutationObserver) {
    new MutationObserver(function(){
      // Next frame: the class has applied but layout has not necessarily run,
      // and offsetHeight is what decides whether there is anything to measure.
      requestAnimationFrame(run);
    }).observe(ov, { attributes:true, attributeFilter:['class','style'] });
  }
})();
</script>

<!-- ── PWA: install the service worker, ask for durable storage ────────────
     The app already runs its engines locally; the service worker is only what
     keeps the files around so it opens and plays with no network. See sw.js
     for what is and isn't cached (notably: it does NOT touch the Maia model —
     maia-worker.js owns that cache).

     storage.persist() matters more here than on a typical site: Maia is a 44MB
     download, and without a persistence grant the browser may evict it under
     disk pressure, silently costing the user that download again. It is only
     granted on engagement, so this asks once per load and takes no for an
     answer — the app works either way, it just may have to re-download. -->
<script>
(function(){
  if ('serviceWorker' in navigator) {
    // After load: registration competes with the model fetch and the WASM
    // compiles for bandwidth otherwise, and it is not needed for first paint.
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(err){
        console.warn('[pwa] service worker registration failed:', err && err.message);
      });
    });
  }
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted()
      .then(function(already){ if (!already) return navigator.storage.persist(); })
      .then(function(granted){
        if (granted === false) console.info('[pwa] storage not persisted — the Maia model may be evicted');
      })
      .catch(function(){ /* unsupported; nothing to do */ });
  }
})();
</script>
