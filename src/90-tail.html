</script>

<!-- ── Bot Control Panel Modal overlay ──────────────────────────────────────── -->
<div id="botModal" style="display:none;position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,0.92);overflow:hidden;">
  <button onclick="closeBotModal()" title="Close bot panel"
    style="position:fixed;top:10px;right:14px;z-index:6001;width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(200,146,42,0.5);background:rgba(14,15,17,0.96);color:#c8922a;
    font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-family:sans-serif;transition:background 0.15s;"
    onmouseover="this.style.background='rgba(200,146,42,0.15)'"
    onmouseout="this.style.background='rgba(14,15,17,0.96)'">✕</button>
  <iframe id="botModalFrame" src="bot-control-panel.html" allow="same-origin"
    style="width:100%;height:100%;border:none;display:block;" title="Bot Configuration"></iframe>
</div>

<!-- ── Guided tour overlay (spotlight; clicks pass through to the app) ───────── -->
<div id="tourOverlay" style="display:none;">
  <div id="tourBackdrop"></div>
  <div id="tourRing"></div>
  <div id="tourPanel">
    <div class="tour-count" id="tourCount"></div>
    <div class="tour-title" id="tourTitle"></div>
    <div class="tour-body" id="tourBody"></div>
    <div class="tour-actions">
      <button class="tour-skip" onclick="endTour()">Skip tour</button>
      <span style="flex:1"></span>
      <button class="tour-btn" id="tourPrev" onclick="tourPrev()">← Back</button>
      <button class="tour-btn tour-next" id="tourNext" onclick="tourNext()">Next →</button>
    </div>
  </div>
</div>

</body>
</html>
